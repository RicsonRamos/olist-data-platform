[project]
name = "olist-data-platform"
version = "1.0.0"
description = "Modern ELT Data Platform and Analytics Lakehouse using Python, dbt, PostgreSQL, and Docker."
authors = [
    {name = "Ricson Ramos", email = "ricsonramos@outlook.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "sqlalchemy>=2.0.28",
    "psycopg2-binary>=2.9.9",
    "dbt-postgres>=1.8.0",
    "python-dotenv>=1.0.1",
    "pyarrow>=15.0.0",
    "fastparquet>=2024.2.0",
    "kagglehub>=0.2.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "plotly>=5.18.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.4.0",
    "sqlfluff>=3.0.0",
    "sqlfluff-templater-dbt>=3.0.0"
]
notebooks = [
    "ipykernel>=6.29.0",
    "nbformat>=5.9.0"
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 88
target-version = "py310"
